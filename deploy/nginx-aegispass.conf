# AegisPass nginx reverse proxy / TLS terminator
#
# Install:
#   sudo ln -s /opt/aegispass/deploy/nginx-aegispass.conf /etc/nginx/sites-enabled/aegispass.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Flask app (gunicorn) listens on 127.0.0.1:8000; nginx terminates TLS
# and proxies to it. The app connects outbound to the domain controller
# (LDAPS 636 / GC 3268) — those ports are never exposed by nginx.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location = /health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # TODO: Provide certificate + key, or use certbot.
    ssl_certificate     /etc/aegispass/certs/fullchain.pem;
    ssl_certificate_key /etc/aegispass/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options        "nosniff" always;
    add_header X-Frame-Options               "SAMEORIGIN" always;
    add_header X-XSS-Protection              "1; mode=block" always;
    add_header Referrer-PoliCY               "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        client_max_body_size 10m;
    }

    location = /health { access_log off; return 200 "ok\n"; }
}
