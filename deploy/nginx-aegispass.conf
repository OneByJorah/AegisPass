# aegispass — nginx reverse proxy / TLS terminator
#
# Install:
#   sudo ln -s /home/j1admin/aegispass/deploy/nginx-aegispass.conf \
#              /etc/nginx/sites-enabled/aegispass.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Flask app (gunicorn) listens on 127.0.0.1:8000; nginx terminates TLS
# and proxies to it. The app itself connects OUTBOUND to the domain controller
# (LDAPS 636 / GC 3268) — those ports are never exposed by nginx.

# ── HTTP : redirect to HTTPS, keep health + ACME reachable ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let certbot/ACME issue certs.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Health probe available over HTTP (e.g. for external monitors).
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Everything else -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS : TLS + app proxy ──────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # ── TLS ───────────────────────────────────────────────────────────────
    # TODO: You MUST provide certificate + key. Copy them to the path below
    # (or change these directives). For certbot/LetsEncrypt the files are
    # typically at /etc/letsencrypt/live/<domain>/fullchain.pem and privkey.pem.
    ssl_certificate     /etc/aegispass/certs/fullchain.pem;
    ssl_certificate_key /etc/aegispass/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options        "nosniff" always;
    add_header X-Frame-Options               "SAMEORIGIN" always;
    add_header X-XSS-Protection              "1; mode=block" always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
    # Uncomment once a valid cert is in place and you want HSTS:
    # add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains" always;

    # ── Proxy to Flask/gunicorn ─────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers (for any live views the app may expose).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        client_max_body_size 10m;
    }

    # Health check (no auth, always 200) — handled by nginx directly.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
